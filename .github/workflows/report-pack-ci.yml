name: report-pack-ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run report pack CI checks
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build_report_pack_ci.ps1
